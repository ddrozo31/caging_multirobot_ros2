# ROS 2 <-> Gazebo topic bridge (ros_gz_bridge / parameter_bridge).
#
# ROS 2 and Gazebo use DIFFERENT message systems. The bridge copies messages
# from one side to the other. Every topic that must cross over is listed here.
#
# Fields of each entry:
#   ros_topic_name : topic name on the ROS 2 side
#   gz_topic_name  : topic name on the Gazebo side   (list Gazebo topics: gz topic -l)
#   ros_type_name  : ROS 2 message type               (e.g. geometry_msgs/msg/Twist)
#   gz_type_name   : Gazebo message type              (e.g. gz.msgs.Twist)
#   direction      : GZ_TO_ROS     Gazebo -> ROS 2   (sensors, clock, poses)
#                    ROS_TO_GZ     ROS 2 -> Gazebo   (commands)
#                    BIDIRECTIONAL both ways
#
# Tip: start topic names with "/" (absolute). Relative names get the node
# namespace added, e.g. "clock" would become "/leader/clock".

# Simulation clock: every node with use_sim_time = true reads /clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Body twist computed by the MecanumController (forward Eq. 1) -> Gazebo
# VelocityControl system, which moves the chassis of the robot (Step 2)
- ros_topic_name: "/mecanum_controller/body_twist"
  gz_topic_name: "/model/rosmaster_x3/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Ground truth pose ("virtual Vicon", Step 3): OdometryPublisher system -> ROS
- ros_topic_name: "/ground_truth/odom"
  gz_topic_name: "/model/rosmaster_x3/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Ground truth as TF (world -> ground_truth), so RViz can show it (Step 3)
- ros_topic_name: "/tf"
  gz_topic_name: "/model/rosmaster_x3/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# ============================================================================
# Step 5: two robots (namespaces /leader and /follower) and the object.
# Same three entries per robot as above, with the robot name in both topic
# names (Gazebo model name = ROS namespace). The entries above (model
# "rosmaster_x3") are still used by the one-robot sim.launch.py of Steps 1-4.
# ============================================================================

# --- Leader ---
- ros_topic_name: "/leader/mecanum_controller/body_twist"
  gz_topic_name: "/model/leader/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/leader/ground_truth/odom"
  gz_topic_name: "/model/leader/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"                          # world -> leader/ground_truth
  gz_topic_name: "/model/leader/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# --- Follower ---
- ros_topic_name: "/follower/mecanum_controller/body_twist"
  gz_topic_name: "/model/follower/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/follower/ground_truth/odom"
  gz_topic_name: "/model/follower/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"                          # world -> follower/ground_truth
  gz_topic_name: "/model/follower/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# --- Object (box, hemisphere or pyramid; Gazebo model name "object") ---
- ros_topic_name: "/object/ground_truth/odom"
  gz_topic_name: "/model/object/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"                          # world -> object
  gz_topic_name: "/model/object/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
