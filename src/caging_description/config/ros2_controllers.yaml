# ros2_control configuration: which controllers exist and their parameters.
# Loaded by the gz_ros2_control plugin (see urdf/gazebo.xacro).
#
# Why "/**/" before each node name (Step 5)?  A key like "mecanum_controller:" only
# matches a node WITHOUT namespace. "/**/mecanum_controller:" matches it in ANY namespace
# (/mecanum_controller, /leader/mecanum_controller, /follower/mecanum_controller),
# so the same file works for one robot and for several.

/**/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz: how many times per second update() of each controller runs

    # Publishes /joint_states (wheel angles) -> robot_state_publisher -> TF of the wheels
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Our controller (package caging_mecanum_controller)
    mecanum_controller:
      type: caging_mecanum_controller/MecanumController

/**/mecanum_controller:
  ros__parameters:
    # Order = wheel index i of Eq. 1 (Fig. 6): front-left, front-right, rear-left, rear-right
    wheel_joints:
      - wheel_0_joint
      - wheel_1_joint
      - wheel_2_joint
      - wheel_3_joint
    # r_w, l_x and l_y are NOT written here (Step 12): the controller reads them from the
    # robot description, i.e. from urdf/robot_core.xacro (wheel_radius, lx, ly). Change the
    # robot there, and Gazebo, RViz and Eq. 1 all follow.
    # Safety (Step 5): no new command for this long [s] -> the robot stops.
    # 0.5 s = 10 LQR cycles: one late message does not stop the robot, a dead node does.
    cmd_timeout: 0.5

    # --- Wheel odometry (Step 3) ---
    odom_frame: odom      # TF: odom -> base_link
    base_frame: base_link
    # Step 5: in a namespace the frames get its name as prefix: leader/odom -> leader/base_link
    tf_frame_prefix_enable: true
    publish_tf: true
    # Errors added ONLY to the odometry (the real motion of the robot is not affected).
    # Start with 0.0 / 1.0 (perfect), then try e.g. 0.5 / 1.02 and watch it drift.
    odom_noise_stddev: 0.0   # random noise on each measured wheel speed [rad/s]
    odom_radius_scale: 1.0   # odometry uses r_w * scale (1.02 = thinks the wheel is 2 % bigger)
